name: Build and test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install install-electron
      - run: npm run check
      - name: Desktop smoke test
        if: runner.os != 'Linux'
        run: npm run test:ui
      - name: Linux desktop smoke test
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:ui
      - name: Build installer
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDrop-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
